version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: clienthunter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clienthunter
      POSTGRES_PASSWORD: clienthunter
      POSTGRES_DB: clienthunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clienthunter-server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://clienthunter:clienthunter@db:5432/clienthunter
      PORT: 3000
    depends_on:
      - db

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: clienthunter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
